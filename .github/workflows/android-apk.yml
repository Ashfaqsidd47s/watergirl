name: Android APK

# Builds an installable Water Girl APK (release build, signed with the debug
# key, so it can be side-loaded). Download it from the run's "Artifacts", or —
# for pushes to main and manual runs — from the repo's Releases page.
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write # to publish the APK as a GitHub release

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck app
        run: npm -w @watergirl/mobile run typecheck

      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: apps/mobile/android
        # arm64 only: covers practically every phone from the last ~8 years and halves build time.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Name the APK
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "out/watergirl-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: watergirl-android-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish APK as a release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${GITHUB_RUN_NUMBER}" out/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Water Girl for Android (build ${GITHUB_RUN_NUMBER})" \
            --notes "Side-loadable APK built from ${GITHUB_SHA::7}. Download the .apk on your phone and open it."
